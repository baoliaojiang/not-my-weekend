name: release

# 触发：推一个 v* 标签就发一版（网页版 + 热更包 + Release）
# 平时往 main 推代码不会自动发布，避免半成品被玩家收到
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 安装依赖（esbuild 用于打包网页）
        run: npm install --no-audit --no-fund

      # make-dist 会重建 dist（把旧的改名成 dist-old），
      # 所以先把已提交进仓库的 APK 与 Windows 分卷挪到临时目录，最后再放回来附到 Release。
      - name: 读取版本号
        id: ver
        run: |
          # 以前这里用 node 内联正则，YAML 转义把 "/\s*" 吃成了 "////s*"，
          # 于是这一步直接语法错误、整个 workflow 从第一步就挂掉（Release 一直发不出来）。
          # 改成和 build-apk.sh / build-exe.sh 一样的 grep，写法统一也不会被转义坑。
          V=$(grep -oE "version: *'[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+'" scripts/config/game.js | head -1 | grep -oE "[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+")
          echo "读到版本：$V"
          test -n "$V"
          echo "v=$V" >> $GITHUB_OUTPUT

      - name: 暂存 APK 与 Windows 分卷
        run: |
          mkdir -p /tmp/rel/apk /tmp/rel/win
          cp dist/apk/*.apk /tmp/rel/apk/ 2>/dev/null || true
          cp dist/win/* /tmp/rel/win/ 2>/dev/null || true

      - name: 构建网页产物
        run: node build/make-www.mjs

      - name: 同步到 out/web
        run: |
          rm -rf build/out/web
          mkdir -p build/out/web
          node build/sync-dir.mjs build/www build/out/web

      - name: 安装 zip（Linux 自带 tar 不写 zip，make-dist 在 Linux 走 zip 命令）
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: 生成 version.json 与热更包
        run: node tools/make-dist.mjs

      # 每版都单独出一个热更包 + 解压目录，不覆盖上一版
      - name: 生成各版本热更包与解压目录
        run: node tools/make-hotfix.mjs

      # Pages 只放网页版，不带 APK/分卷（体积大，也没必要）。
      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: 放回 APK 与 Windows 分卷
        run: |
          mkdir -p dist/win dist/rel
          cp /tmp/rel/win/* dist/win/ 2>/dev/null || true
          # GitHub 会把非 ASCII 文件名压成同一串（两个中文 APK 都会变成 -0.6.2.3-.apk），
          # 第二个就会撞名被当成「更新已存在附件」而 404。所以附件改用 ASCII 文件名。
          #
          # dist/apk 里存的已经是 ASCII 名（NotMyWeekend-<版本>-standard.apk），
          # 早先这里按中文名「*标准版*」去匹配，匹配不到，
          # 于是 Release 页面一个 APK 附件都没有。这里两种命名都认，
          # 认不到就直接失败，别再悄悄发出一个没有 APK 的版本。
          V="${{ steps.ver.outputs.v }}"
          if   ls /tmp/rel/apk/*standard*.apk >/dev/null 2>&1; then
            cp /tmp/rel/apk/*standard*.apk "dist/rel/NotMyWeekend-${V}-standard.apk"
          elif ls /tmp/rel/apk/*标准版*.apk >/dev/null 2>&1; then
            cp /tmp/rel/apk/*标准版*.apk "dist/rel/NotMyWeekend-${V}-standard.apk"
          else
            echo "::error::dist/apk 里找不到标准版 APK"; exit 1
          fi
          if   ls /tmp/rel/apk/*compat*.apk >/dev/null 2>&1; then
            cp /tmp/rel/apk/*compat*.apk "dist/rel/NotMyWeekend-${V}-compat.apk"
          elif ls /tmp/rel/apk/*兼容版*.apk >/dev/null 2>&1; then
            cp /tmp/rel/apk/*兼容版*.apk "dist/rel/NotMyWeekend-${V}-compat.apk"
          else
            echo "::error::dist/apk 里找不到兼容版 APK"; exit 1
          fi
          ls -lh dist/rel dist/win

      - name: 清理旧附件（避免同名「更新附件」404）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 按 asset id 删除，避免中文名在 shell 里被转义弄丢导致删不掉
          gh api "repos/${{ github.repository }}/releases/tags/${{ github.ref_name }}" \
            --jq '.assets[] | "\(.id)"' 2>/dev/null | while IFS= read -r id; do
              [ -n "$id" ] && gh api -X DELETE "repos/${{ github.repository }}/releases/assets/$id"
            done

      # 发布说明不再手写：正文来自 dist/release-notes.md（由 make-dist 从游戏内
      # 更新日志生成），这里只追加「兼容版」与「下载」两段固定说明，
      # 保证玩家在游戏里和发布页看到的是同一套说法。
      - name: 拼发布说明
        run: |
          {
            cat dist/release-notes.md
            cat <<'EOF'

          ## 关于「兼容版」

          兼容版**不内嵌任何浏览器内核**（Android WebView 是系统组件，无法随安装包分发），只解决布局 / API 缺失。内核真的太老，请用上面的「用浏览器打开网页版」，或更新 Android System WebView / Chrome。

          ## 下载（见本发布下方附件）

          - Android 标准版 / 兼容版：`NotMyWeekend-${{ steps.ver.outputs.v }}-standard.apk` / `NotMyWeekend-${{ steps.ver.outputs.v }}-compat.apk`（存档互通）
          - Windows 便携版：因超过 GitHub 单文件 100MB，拆成多段 + `merge.bat`；把分卷与 `merge.bat` 放在同一目录，双击 `merge.bat` 得到 zip 再解压
          - 网页版（免安装）：https://baoliaojiang.github.io/not-my-weekend/

          存档保存在本地，覆盖安装不会丢。反馈：提 Issue，或游戏主界面右下角「反馈问题」填问卷。
          EOF
          } > dist/release-body.md
          head -20 dist/release-body.md

      - name: 发布 Release（附全部产物）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/www-*.zip
            dist/version.json
            dist/versions.json
            dist/rel/*.apk
            dist/win/*
            releases/hotfix-*/*.zip
            releases/hotfix-*/SHA256SUMS.txt
          body_path: dist/release-body.md
