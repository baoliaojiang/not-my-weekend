name: release

# 触发：推一个 v* 标签就发一版（网页版 + 热更包 + Release）
# 平时往 main 推代码不会自动发布，避免半成品被玩家收到
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建网页产物
        run: node build/make-www.mjs

      - name: 同步到 out/web
        run: |
          rm -rf build/out/web
          mkdir -p build/out/web
          node build/sync-dir.mjs build/www build/out/web

      - name: 生成 version.json 与热更包
        run: |
          # tar 在 ubuntu 上同样能写 zip（先打 tar 再用 zip 也行，这里直接用 zip 命令）
          node -e "
          const {execFileSync}=require('node:child_process');
          " || true
          # 不用 node 里的 tar 分支（Linux 的 tar 不写 zip），改用 zip
          node tools/make-dist.mjs.ci

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: 发布 Release（附热更包）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/www-*.zip
            dist/version.json
          body: |
            自动构建发布。网页版：https://<你的用户名>.github.io/<仓库名>/
            APK / EXE 的热更新会从这里取的 version.json 读取新版本。
