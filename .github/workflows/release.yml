name: release

# 触发：推一个 v* 标签就发一版（网页版 + 热更包 + Release）
# 平时往 main 推代码不会自动发布，避免半成品被玩家收到
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 构建网页产物
        run: node build/make-www.mjs

      - name: 同步到 out/web
        run: |
          rm -rf build/out/web
          mkdir -p build/out/web
          node build/sync-dir.mjs build/www build/out/web

      - name: 安装 zip（Linux 自带 tar 不写 zip，make-dist 在 Linux 走 zip 命令）
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: 生成 version.json 与热更包
        run: node tools/make-dist.mjs --notes "自动构建发布（网页版 + 热更包）"

      - name: 部署到 GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages

      - name: 发布 Release（附热更包）
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/www-*.zip
            dist/version.json
          body: |
            自动构建发布：网页版与热更新包。
            网页版（免安装）：https://baoliaojiang.github.io/not-my-weekend/dist/
            APK / EXE 的热更新会读取本 Release 里的 version.json 与 www-*.zip。
            Android 双包与 Windows 便携版由作者在发布说明里手动附上。
